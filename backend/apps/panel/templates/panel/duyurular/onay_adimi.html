{% extends "panel/base.html" %}
{% block baslik %}{{ baslik }} · DİYAK Panel{% endblock %}
{% block icerik %}
<header class="sayfa-basi">
  <div>
    <p class="ust-baslik"><a href="{% url 'panel:duyuru' duyuru.pk %}">{{ duyuru.baslik }}</a></p>
    <h1>{{ baslik }}</h1>
  </div>
</header>
<div class="onay-kutusu">
  <p>{{ metin }}</p>
  <form method="post" class="dugmeler">
    {% csrf_token %}
    <button type="submit">{{ dugme }}</button>
    <a href="{% url 'panel:duyuru' duyuru.pk %}">Vazgeç</a>
  </form>
</div>
{% endblock %}
