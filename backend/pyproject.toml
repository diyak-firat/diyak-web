[project]
name = "diyak-backend"
version = "0.1.0"
description = "DİYAK yönetim paneli ve API (Faz 2)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
    "django-otp>=1.7,<2",
    "django-axes>=9.1,<10",
    "segno>=1.6,<2",
    "nh3>=0.3,<0.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "bandit>=1.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "-ra --strict-markers"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
