<!doctype html>
<!--
  Open Graph görseli kaynağı (1200×630). Çıktı: frontend/public/og.png
  Yeniden üretmek için design/og/README.md dosyasına bakın.
  Renkler frontend/src/styles/tokens.css ile aynıdır; yazı tipleri frontend/node_modules altındaki fontsource paketlerinden gelir.
-->
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../frontend/node_modules/@fontsource-variable/source-serif-4/opsz.css" />
    <link rel="stylesheet" href="../../frontend/node_modules/@fontsource/ibm-plex-sans/400.css" />
    <link rel="stylesheet" href="../../frontend/node_modules/@fontsource/ibm-plex-mono/500.css" />
    <style>
      :root {
        --navy: #1e2142;
        --navy-line: #3a3d63;
        --on-navy: #c9cbda;
        --on-navy-muted: #a3a6c2;
        --accent: #e5533a;
        --paper: #ffffff;
        --serif: 'Source Serif 4 Variable', serif;
        --sans: 'IBM Plex Sans', sans-serif;
        --mono: 'IBM Plex Mono', monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--navy);
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 80px 88px 72px;
        color: var(--on-navy);
        font-family: var(--sans);
      }
      .ust {
        display: flex;
        align-items: center;
        gap: 48px;
      }
      .ust svg {
        flex: none;
      }
      .ad {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 104px;
        line-height: 1;
        letter-spacing: 0.01em;
        color: var(--paper);
      }
      .tam-ad {
        margin-top: 18px;
        font-size: 30px;
        line-height: 1.3;
        color: var(--on-navy);
      }
      .alt {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding-top: 32px;
        border-top: 1px solid var(--navy-line);
      }
      .kurum {
        font-family: var(--mono);
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--on-navy-muted);
      }
      .bicimbirim {
        display: flex;
        gap: 10px;
        font-family: var(--mono);
        font-weight: 500;
        font-size: 26px;
        color: var(--on-navy);
      }
      .bicimbirim span {
        padding-bottom: 8px;
        border-bottom: 5px solid var(--on-navy-muted);
      }
      .bicimbirim .kok {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="ust">
      <!-- design/logo/diyak-logo-beyaz.svg -->
      <svg width="168" height="168" viewBox="0 0 110 110" aria-hidden="true">
        <g fill="#FFFFFF">
          <rect x="0" y="0" width="40" height="10" rx="5" />
          <rect x="44" y="0" width="40" height="10" rx="5" />
          <rect x="0" y="20" width="28" height="10" rx="5" />
          <rect x="62" y="20" width="40" height="10" rx="5" />
          <rect x="0" y="40" width="28" height="10" rx="5" />
          <rect x="76" y="40" width="34" height="10" rx="5" />
          <rect x="0" y="60" width="28" height="10" rx="5" />
          <rect x="76" y="60" width="34" height="10" rx="5" />
          <rect x="0" y="80" width="28" height="10" rx="5" />
          <rect x="62" y="80" width="40" height="10" rx="5" />
          <rect x="0" y="100" width="58" height="10" rx="5" />
        </g>
        <rect x="62" y="100" width="22" height="10" rx="5" fill="#E5533A" />
      </svg>
      <div>
        <p class="ad">DİYAK</p>
        <p class="tam-ad">Doğal Dil İşleme ve<br />Yapay Zekâ Araştırmaları Topluluğu</p>
      </div>
    </div>
    <div class="alt">
      <p class="kurum">Fırat Üniversitesi</p>
      <p class="bicimbirim" aria-hidden="true">
        <span class="kok">anla</span><span>ya</span><span>ma</span><span>dık</span><span>lar</span><span>ımız</span>
      </p>
    </div>
  </body>
</html>
