# DİYAK servisleri. Canlı ve deneme sunucusunda bu dosya tek başına kullanılır (OPERASYON.md).
# Yerelde .env içindeki COMPOSE_FILE, docker-compose.dev.yml'yi de ekler (bkz. .env.example).
#
# UYARI: `docker compose down -v` ASLA çalıştırılmaz; -v veritabanı volume'ünü siler.
# TODO (yayın hazırlığı): Caddy (TLS), statik dosyalar. STATUS.md'de.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: diyak
      POSTGRES_USER: diyak
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets: [db_password]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U diyak -d diyak']
      interval: 10s
      retries: 5
    # "ports" YOK: veritabanı dışarı açılmaz, yalnızca aynı ağdaki Django erişir.

  # Kısa ömürlü sayaçlar ve önbellek (herkese açık formların istek sınırı; IP diske yazılmaz).
  # Valkey: Redis'in BSD lisanslı çatalı, aynı protokol (K-28). Kalıcılık kapalı: yedeklenecek veri tutmaz.
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--save', '', '--appendonly', 'no', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      retries: 5
    # "ports" YOK: yalnızca aynı ağdaki Django erişir.

  web:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DB_HOST: db
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_URL: redis://redis:6379/0
    secrets: [db_password, django_secret_key]
    volumes:
      # Yüklenen herkese açık görseller (ekip fotoğrafları; K-27). Yedeğe dahil edilmeli (STATUS.md).
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  media:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  django_secret_key:
    file: ./secrets/django_secret_key.txt
